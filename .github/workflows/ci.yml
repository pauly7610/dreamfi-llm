name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Generate templ
        run: go run github.com/a-h/templ/cmd/templ@v0.3.1001 generate

      - name: Check generated templ
        run: git diff --exit-code web/templates

      - name: Go tests
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Ruff
        run: python -m ruff check dreamfi/ tests/

      - name: Mypy (strict)
        run: python -m mypy --strict dreamfi

      - name: Pytest
        run: python -m pytest -q -m "not live_onyx"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: generators/web/yarn.lock

      - name: Install frontend dependencies
        working-directory: generators/web
        run: yarn install --frozen-lockfile

      - name: Frontend tests
        working-directory: generators/web
        run: yarn test --run

      - name: Frontend build
        working-directory: generators/web
        run: yarn build
